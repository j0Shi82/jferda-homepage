# pnpm 11 no longer reads pnpm-specific settings from .npmrc; they live here.

# @material/* are mostly transitive deps (via @smui/*), but the Sass sources
# import them by bare specifier with node_modules on the load path, so they must
# be hoisted into the root node_modules to resolve.
publicHoistPattern:
  - '@material/*'

# None of these need their install scripts to run (esbuild's binaries come from
# its optional platform packages). Declared explicitly so `pnpm install` does
# not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  svelte-preprocess: false
